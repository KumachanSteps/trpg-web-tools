<main>
  <section class="page-hero wrap">
    <p class="eyebrow">Records</p>
    <h1>これまでの記録</h1>
    <p>参加・GMを務めたセッションの記録です。件数はカードで、詳細は下の一覧でご覧いただけます。</p>
  </section>

  <section class="content-section wrap">
    <div class="counters">
      <div class="counter-card panel">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.8 2.8M16.2 16.2 19 19M19 5l-2.8 2.8M7.8 16.2 5 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <div class="num" id="record-stat-current">0</div>
        <div class="label">現行</div>
      </div>
      <div class="counter-card panel">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M12 2 14.7 9h7.3l-5.9 4.3 2.3 7.2L12 16.1 5.6 20.5l2.3-7.2L2 9h7.3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <div class="num" id="record-stat-planning">0</div>
        <div class="label">予定</div>
      </div>
      <div class="counter-card panel">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 1 0 9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 3a9 9 0 0 1 8.4 5.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1.5 3.4"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></svg>
        <div class="num" id="record-stat-played">0</div>
        <div class="label">プレイ済み</div>
      </div>
      <div class="counter-card panel">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M12 3 3 8.5 12 14l9-5.5L12 3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 11.5v5c0 1.4 2.7 3 6 3s6-1.6 6-3v-5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <div class="num" id="record-stat-gm">0</div>
        <div class="label">GM可能</div>
      </div>
    </div>
  </section>

  <section class="content-section wrap">
    <div class="section-head">
      <div>
        <p class="eyebrow">Log</p>
        <h2>プレイ記録</h2>
      </div>
    </div>

    <div class="record-toolbar">
      <div class="filter-row">
        <button type="button" class="filter-pill is-active" data-record-filter="all">すべて</button>
        <button type="button" class="filter-pill" data-record-filter="pl">PLとして</button>
        <button type="button" class="filter-pill" data-record-filter="gm">GM・KP・DLとして</button>
      </div>
      <p id="record-result-count" class="record-result-count">0 RECORDS</p>
    </div>

    <div class="stub-list" id="record-list">
      <p class="manager-empty">記録を読み込んでいます。</p>
    </div>
    <button type="button" id="record-load-more" class="record-load-more" hidden>さらに表示</button>
  </section>
