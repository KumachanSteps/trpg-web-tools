<!doctype html>
<html lang="ja">
<head>
  <script async src="../../assets/js/analytics.js"></script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KPレス・ジュークボックスメーカー｜TRPG WEBツール観測所</title>
  <meta name="description" content="ココフォリアのクリックアクションと /scene コマンドで動く、KPがいなくても使えるジュークボックス部屋を作るツールです。シーンとマーカーパネルのつながりを線で一覧できます。" />
  <link rel="icon" href="../../assets/img/kuma_icon.png?v=20260910" type="image/png" />
  <link rel="shortcut icon" href="../../assets/img/kuma_icon.png?v=20260910" type="image/png" />
  <link rel="stylesheet" href="./css/jukebox.css?v=20261107-08" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-row">
        <h1 class="app-name"><span data-i18n="title">KPレス・ジュークボックスメーカー</span><span class="app-version">v0.26 / 2026.11.07</span></h1>
        <span class="header-spacer"></span>
        <div class="sound-control" role="group" data-i18n-label="sound.group" aria-label="BGM">
          <button class="sound-toggle" type="button" id="soundToggle" aria-pressed="true"><span class="sound-icon" aria-hidden="true">♪</span><span id="soundLabel">BGM ON</span></button>
          <input class="sound-volume" type="range" id="soundVolume" min="0" max="100" step="1" value="50" data-i18n-label="sound.volume" aria-label="音量" />
        </div>
        <a class="header-nav-link" href="../../"><span class="nav-long" data-i18n="portal">←TRPG WEBツール観測所</span><span class="nav-short" data-i18n="portalShort">←観測所</span></a>
        <div class="language-switcher" role="group" data-i18n-label="langGroup" aria-label="言語切替">
          <button class="lang-choice-button is-active" type="button" data-lang-choice="ja" aria-pressed="true">JP</button>
          <span class="lang-divider" aria-hidden="true">|</span>
          <button class="lang-choice-button" type="button" data-lang-choice="en" aria-pressed="false">EN</button>
          <span class="lang-divider" aria-hidden="true">|</span>
          <button class="lang-choice-button" type="button" data-lang-choice="ko" aria-pressed="false">KR</button>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <button class="ghost-button" type="button" id="importBtn" data-i18n="bar.importZip">ZIPを読み込む</button>
      <input type="file" id="importFile" accept=".zip,application/zip" class="visually-hidden" tabindex="-1" aria-hidden="true" />
      <button class="ghost-button" type="button" id="backBtn" data-i18n="bar.backToJukebox" hidden>ジュークボックスに戻る</button>
      <span class="bar-spacer"></span>
      <button class="text-button" type="button" id="layoutResetBtn" data-i18n="layout.reset">並びを元に戻す</button>
      <button class="ghost-button" type="button" id="helpBtn" aria-expanded="false" aria-controls="helpDrawer" data-i18n="help">使い方</button>
      <button class="ghost-button" type="button" id="playBtn" data-i18n="bar.play">テストプレイ</button>
      <button class="accent-button" type="button" id="exportBtn" data-i18n="bar.export">ルームZIPを書き出す</button>
    </div>

    <section class="drawer" id="helpDrawer" hidden>
      <h2 data-i18n="help">使い方</h2>
      <button class="drawer-close" type="button" data-close-drawer data-i18n-label="close" aria-label="閉じる">×</button>
      <div class="guide-list" id="helpList"></div>
      <div class="guide-notes" id="helpNotes"></div>
    </section>

    <div class="layout" id="layout">
      <section class="panel card" data-panel="scenes">
        <div class="panel-bar"><button class="drag-handle" type="button" data-drag-handle data-i18n-label="layout.drag" aria-label="ドラッグで並べ替え"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button><h2 class="panel-title" data-i18n="graph.list">シーン一覧</h2></div>
        <ol class="scene-list" id="sceneGrid"></ol>
      </section>

      <section class="panel card" data-panel="stage">
        <div class="panel-bar">
          <button class="drag-handle" type="button" data-drag-handle data-i18n-label="layout.drag" aria-label="ドラッグで並べ替え"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button>
          <h2 class="panel-title" data-i18n="graph.heading">シーンのつながり</h2>
          <span class="graph-count" id="graphCount"></span>
          <span class="bar-spacer"></span>
          <div class="segment-group" role="group">
            <button class="segment" type="button" data-lines="all" data-i18n="graph.showAll">すべての線</button>
            <button class="segment" type="button" data-lines="selected" data-i18n="graph.showSelected">選んだパネルの線だけ</button>
          </div>
        </div>
        <p class="muted-note" data-i18n="graph.hint"></p>
        <div class="warn-box" id="warnBox" hidden></div>
        <h3 class="stage-title" id="detailTitle"></h3>
        <div class="detail-board" id="detailBoard"></div>
        <div class="inspector" id="inspector">
          <h3 class="section-title small" data-i18n="insp.heading">パネルの中身</h3>
          <div id="inspectorBody"></div>
        </div>
      </section>

      <section class="panel card side" data-panel="settings" id="side">
        <div class="panel-bar"><button class="drag-handle" type="button" data-drag-handle data-i18n-label="layout.drag" aria-label="ドラッグで並べ替え"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button><h2 class="panel-title" id="settingsTitle" data-i18n="set.heading">ジュークボックスの設定</h2></div>
        <div id="jukeboxPanel">
          <label class="field"><span class="field-label" data-i18n="set.roomName">部屋の名前</span><input class="text-input" id="roomName" type="text" maxlength="80" /></label>
          <label class="field"><span class="field-label" data-i18n="set.stopName">停止中のシーン名</span><input class="text-input" id="stopName" type="text" maxlength="40" /></label>
          <div class="field backdrop-field" id="backdropField">
            <span class="field-label" data-i18n="set.backdrop">ココフォリア部屋の背景画像</span>
            <div class="backdrop-row">
              <button class="backdrop-thumb" type="button" id="backdropThumb" data-i18n-label="set.backdropOpen" aria-label="画像を開く"><img id="backdropImg" alt="" /></button>
              <button class="ghost-button small" type="button" id="backdropOpen" data-i18n="set.backdropOpen">画像を開く</button>
              <button class="text-button" type="button" id="backdropClear" data-i18n="set.backdropClear" hidden>外す</button>
              <input type="file" id="backdropFile" accept="image/*" class="visually-hidden" tabindex="-1" aria-hidden="true" />
            </div>
          </div>
          <div class="field">
            <span class="field-label" data-i18n="set.count">レコードの枚数</span>
            <div class="count-row">
              <input type="range" id="diskCount" min="1" max="12" step="1" />
              <output id="diskCountOut" for="diskCount">9</output>
            </div>
          </div>
          <div class="field">
            <label class="toggle-field"><input type="checkbox" id="showCover" checked /><span class="field-label" data-i18n="set.showCover">ジャケットを表示する</span></label>
            <p class="muted-note" data-i18n="set.showCoverNote"></p>
          </div>
          <p class="field-label" data-i18n="set.disks">レコード</p>
          <ol class="disk-list" id="diskList"></ol>
          <button class="text-button" type="button" id="resetBtn" data-i18n="set.reset">最初の設定に戻す</button>
        </div>
        <div id="importPanel" hidden>
          <h3 class="section-title small" data-i18n="io.importedTitle">読み込んだ部屋</h3>
          <p class="import-name" id="importName"></p>
          <p class="muted-note" data-i18n="io.importedNote"></p>
        </div>
        <div class="shape-box">
          <p class="shape-label" id="shapeLabel"></p>
          <button class="text-button" type="button" id="shapeResetBtn" data-i18n="io.shapeReset" hidden>推測に戻す</button>
        </div>
      </section>

      <svg class="link-layer" id="linkLayer" aria-hidden="true"></svg>
    </div>

    <div class="modal-backdrop" id="playModal" hidden>
      <section class="modal play-modal" role="dialog" aria-modal="true" aria-labelledby="playTitle">
        <button class="drawer-close" type="button" data-close-modal data-i18n-label="close" aria-label="閉じる">×</button>
        <h2 id="playTitle" data-i18n="play.heading">テストプレイ</h2>
        <div class="play-status">
          <span id="playScene"></span>
          <span id="playBgm" class="play-bgm"></span>
          <span class="bar-spacer"></span>
          <button class="ghost-button small" type="button" id="playRestart" data-i18n="play.restart">最初のシーンに戻す</button>
        </div>
        <div class="play-board" id="playBoard"></div>
        <ol class="play-chat" id="playChat"></ol>
      </section>
    </div>

    <div class="modal-backdrop" id="coverModal" hidden>
      <section class="modal cover-modal" role="dialog" aria-modal="true" aria-labelledby="coverTitle">
        <button class="drawer-close" type="button" data-close-cover data-i18n-label="close" aria-label="閉じる">×</button>
        <h2 id="coverTitle">ジャケットの画像</h2>
        <div class="cover-layout">
        <div class="cover-side">
          <aside class="cover-presets" id="coverPresets" aria-labelledby="coverPresetsTitle"></aside>
          <button class="ghost-button small cover-open" type="button" id="cropOpen" data-i18n="cover.open">ファイルを開く</button>
        </div>
        <div class="cover-main">
        <p class="muted-note" data-i18n="cover.hint"></p>
        <div class="crop-drop" id="cropDrop">
          <canvas id="cropCanvas" width="538" height="520"></canvas>
          <p class="crop-empty" id="cropEmpty" data-i18n="cover.empty">ここに画像をドラッグ＆ドロップ、またはクリックしてファイルを開く</p>
        </div>
        <div class="crop-controls">
          <input type="file" id="cropFile" accept="image/*" class="visually-hidden" tabindex="-1" aria-hidden="true" />
          <label class="crop-zoom"><span data-i18n="cover.zoom">拡大</span><input type="range" id="cropZoom" min="0" max="100" step="1" value="0" /></label>
          <button class="text-button" type="button" id="cropFit" data-i18n="cover.fit">全体を合わせる</button>
        </div>
        </div>
        </div>
        <div class="crop-actions">
          <button class="text-button" type="button" id="cropRemove" data-i18n="cover.remove">画像を外す</button>
          <span class="bar-spacer"></span>
          <button class="ghost-button" type="button" data-close-cover data-i18n="cover.cancel">キャンセル</button>
          <button class="accent-button" type="button" id="cropOk" data-i18n="cover.ok">この範囲で決定</button>
        </div>
      </section>
    </div>

    <div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="true"></div>

    <footer class="legal-footer">
      <h2 data-i18n="footer.title">利用上の注意</h2>
      <p data-i18n-html="footer.note1"></p>
      <p data-i18n-html="footer.note2"></p>
      <p data-i18n-html="footer.note3"></p>
      <p id="photoCredits"></p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="./js/i18n.js?v=20261107-08"></script>
  <script src="./js/ccfolia.js?v=20261107-08"></script>
  <script src="./js/jukebox.js?v=20261107-08"></script>
  <script src="./js/app.js?v=20261107-08"></script>
</body>
</html>
