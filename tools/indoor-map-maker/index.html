<!doctype html>
<html lang="ja">
<head>
  <script async src="../../assets/js/analytics.js"></script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- クローズドテスト中は検索エンジンに載せない（一般公開するときに外す） -->
  <meta name="robots" content="noindex, nofollow" />
  <title>TRPG室内図メーカー｜TRPG WEBツール観測所</title>
  <meta name="description" content="TRPGの探索シーンで使う室内の見取り図を、ブラウザだけで作成できるツールです。1LDK・一戸建て・洋館・ホテル・病院・廃墟のテンプレートから始めて、部屋・ドア・窓・家具を置いてPNGで書き出せます。" />
  <link rel="icon" href="../../assets/img/kuma_icon.png?v=20260910" type="image/png" />
  <link rel="shortcut icon" href="../../assets/img/kuma_icon.png?v=20260910" type="image/png" />
  <link rel="stylesheet" href="./css/indoor-map-maker.css?v=20261007-01" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="title-block">
        <p class="eyebrow" data-i18n="eyebrow">TRPG WEBツール観測所</p>
        <h1 id="appTitle" data-i18n="title">TRPG室内図メーカー</h1>
      </div>
      <p class="lead" data-i18n="lead">探索シーンで使う室内の見取り図を作成します。テンプレートから始めて、部屋・ドア・窓・家具を置き、PL用とGM用の画像を書き出せます。</p>
      <div class="header-actions">
        <a class="header-nav-link" href="../../" data-i18n="portal">←TRPG WEBツール観測所</a>
        <a class="x-share-link" id="xShareLink" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener noreferrer" data-i18n-label="share" aria-label="X / Twitterで共有"><span aria-hidden="true">𝕏</span></a>
        <div class="language-switcher" id="languageSwitcher" role="group" data-i18n-label="langGroup" aria-label="言語切替">
          <button class="lang-choice-button is-active" type="button" data-lang-choice="ja" aria-pressed="true">JP</button>
          <span class="lang-divider" aria-hidden="true">|</span>
          <button class="lang-choice-button" type="button" data-lang-choice="en" aria-pressed="false">EN</button>
          <span class="lang-divider" aria-hidden="true">|</span>
          <button class="lang-choice-button" type="button" data-lang-choice="ko" aria-pressed="false">KR</button>
        </div>
        <button class="ghost-button" type="button" id="helpBtn" aria-expanded="false" aria-controls="helpDrawer" data-i18n="help">使い方</button>
        <button class="ghost-button" type="button" id="shortcutBtn" aria-expanded="false" aria-controls="shortcutDrawer" data-i18n="shortcuts">ショートカット</button>
        <button class="ghost-button theme-button" type="button" id="themeBtn"><span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-thumb">☀️</span></span></button>
      </div>
      <div class="version-engrave">v1.03 / 2026.10.07</div>
    </header>

    <section class="drawer" id="helpDrawer" hidden>
      <h2 data-i18n="help">使い方</h2>
      <button class="drawer-close" type="button" data-close-drawer data-i18n-label="close" aria-label="閉じる">×</button>
      <div class="guide-list" id="helpList"></div>
      <div class="guide-notes" id="helpNotes"></div>
    </section>

    <section class="drawer" id="shortcutDrawer" hidden>
      <h2 data-i18n="shortcutTitle">ショートカット一覧</h2>
      <button class="drawer-close" type="button" data-close-drawer data-i18n-label="close" aria-label="閉じる">×</button>
      <div class="shortcut-grid" id="shortcutGrid"></div>
    </section>

    <main class="editor" id="editor">
      <aside class="panel library-panel" aria-label="Library">
        <div class="lib-tabs" id="libTabs" role="tablist">
          <button class="lib-tab is-active" type="button" role="tab" data-lib="rooms" data-i18n="lib.rooms">部屋</button>
          <button class="lib-tab" type="button" role="tab" data-lib="openings" data-i18n="lib.openings">ドア・窓</button>
          <button class="lib-tab" type="button" role="tab" data-lib="furniture" data-i18n="lib.furniture">家具・小物</button>
        </div>
        <div class="lib-body" id="libBody"></div>
      </aside>

      <section class="panel canvas-panel" aria-labelledby="appTitle">
        <div class="editor-bar">
          <div class="bar-group">
            <button class="primary-button" type="button" id="tplBtn"><svg class="bar-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1" /><rect x="13.5" y="3.5" width="7" height="7" rx="1" /><rect x="3.5" y="13.5" width="7" height="7" rx="1" /><rect x="13.5" y="13.5" width="7" height="7" rx="1" /></svg><span data-i18n="bar.templates">テンプレート</span></button>
            <button class="ghost-button" type="button" id="newBtn" data-i18n="bar.new">新規</button>
            <button class="ghost-button" type="button" id="openBtn" data-i18n="bar.open">開く</button>
            <button class="ghost-button" type="button" id="saveBtn" data-i18n="bar.save">保存</button>
            <input type="file" id="openFile" accept=".json,.trpgmap,application/json" class="visually-hidden" tabindex="-1" aria-hidden="true" />
          </div>
          <div class="bar-group">
            <button class="icon-button" type="button" id="undoBtn" data-i18n-label="bar.undo" aria-label="元に戻す"><svg class="bar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg></button>
            <button class="icon-button" type="button" id="redoBtn" data-i18n-label="bar.redo" aria-label="やり直す"><svg class="bar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></svg></button>
          </div>
          <span class="bar-spacer"></span>
          <div class="segment-group" id="viewToggle" role="group" data-i18n-label="bar.viewLabel" aria-label="表示">
            <button class="segment is-active" type="button" data-view="gm" data-i18n="bar.gm">GM表示</button>
            <button class="segment" type="button" data-view="pl" data-i18n="bar.pl">PL表示</button>
          </div>
          <button class="accent-button" type="button" id="exportBtn" data-i18n="bar.export">画像を書き出す</button>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="mapCanvas" tabindex="0" aria-label="Map"></canvas>
          <div class="tool-strip" id="toolStrip" role="toolbar" aria-orientation="vertical">
            <button class="tool-button is-active" type="button" data-tool="select"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5 18.5 10l-6 1.8-2.6 6.2z" /></svg><span class="tool-key">V</span></button>
            <button class="tool-button" type="button" data-tool="hand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12.5V6a1.5 1.5 0 0 1 3 0v5.5" /><path d="M11 11V4.5a1.5 1.5 0 0 1 3 0V11" /><path d="M14 11V6a1.5 1.5 0 0 1 3 0v7.5a6.5 6.5 0 0 1-6.5 6.5h-.6a6 6 0 0 1-4.9-2.6L3.8 14a1.5 1.5 0 0 1 2.4-1.7L8 14.5" /></svg><span class="tool-key">H</span></button>
            <span class="tool-sep" aria-hidden="true"></span>
            <button class="tool-button" type="button" data-tool="room"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h16v15H4z" /><path d="M12 4.5v6.5H4" /></svg><span class="tool-key">B</span></button>
            <button class="tool-button" type="button" data-tool="wall"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h9V6h7" stroke-width="3.4" /></svg><span class="tool-key">W</span></button>
            <button class="tool-button" type="button" data-tool="door"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 20h4M17.5 20h4" stroke-width="3" /><path d="M6.5 20V8.5" /><path d="M6.5 8.5a11.5 11.5 0 0 1 11 11.5" stroke-dasharray="2 2.2" /></svg><span class="tool-key">D</span></button>
            <button class="tool-button" type="button" data-tool="window"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12h3.5M18 12h3.5" stroke-width="3" /><path d="M6 10h12v4H6z" /><path d="M6 12h12" /></svg><span class="tool-key">N</span></button>
            <button class="tool-button" type="button" data-tool="text"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7V4.5h14V7" /><path d="M12 4.5v15" /><path d="M9 19.5h6" /></svg><span class="tool-key">T</span></button>
            <span class="tool-sep" aria-hidden="true"></span>
            <button class="tool-button" type="button" data-tool="eraser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20h11" /><path d="M5 15.5 14 6.5a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11.5 19H8.5z" /><path d="m9.5 11 5 5" /></svg><span class="tool-key">E</span></button>
          </div>
          <button class="clue-toggle is-on" type="button" id="clueToggle" aria-pressed="true"><svg class="bar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" /><path d="m15 15 5.5 5.5" /></svg><span class="clue-label" data-i18n="bar.clues">隠し手がかり</span><span class="clue-state" id="clueState">ON</span></button>
          <div class="mini-bar" id="miniBar" hidden>
            <button type="button" data-mini="rotate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7" /><path d="M20 4v5h-5" /></svg></button>
            <button type="button" data-mini="flip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18" stroke-dasharray="2 2.4" /><path d="M9 7 4 17h5z" /><path d="m15 7 5 10h-5z" /></svg></button>
            <button type="button" data-mini="hinge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16" /><path d="M8 19V9" /><path d="M8 9a10 10 0 0 1 10 10" stroke-dasharray="2 2.2" /><circle cx="8" cy="19" r="1.6" /></svg></button>
            <button type="button" data-mini="gm"></button>
            <button type="button" data-mini="clue"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" /><path d="m15 15 5.5 5.5" /></svg></button>
            <button type="button" data-mini="lock"></button>
            <button type="button" data-mini="duplicate"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2" /><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5" /></svg></button>
            <button type="button" data-mini="delete" class="is-danger"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15" /><path d="M9.5 7V4.5h5V7" /><path d="M6.5 7l1 13h9l1-13" /></svg></button>
          </div>
          <p class="canvas-hint" id="canvasHint" aria-live="polite"></p>
          <div class="zoom-box">
            <button type="button" id="zoomOutBtn" data-i18n-label="zoom.out" aria-label="縮小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg></button>
            <button type="button" class="zoom-value" id="zoomValue" data-i18n-label="zoom.fit" aria-label="全体を表示">100%</button>
            <button type="button" id="zoomInBtn" data-i18n-label="zoom.in" aria-label="拡大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg></button>
            <button type="button" id="fitBtn" data-i18n-label="zoom.fit" aria-label="全体を表示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg></button>
          </div>
        </div>

        <div class="floor-bar" id="floorBar"></div>
      </section>

      <aside class="panel props-panel" id="propsPanel" aria-live="polite"></aside>
    </main>

    <div class="modal-backdrop" id="tplModal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="tplTitle">
        <button class="drawer-close" type="button" data-close-modal data-i18n-label="close" aria-label="閉じる">×</button>
        <div class="modal-head-row">
          <h2 id="tplTitle" data-i18n="tpl.title">テンプレートから始める</h2>
          <div class="tpl-options">
            <label class="toggle-inline"><span class="switch"><input type="checkbox" class="switch-input" id="tplStructureOnly" /><span class="switch-track" aria-hidden="true"></span></span><span data-i18n="tpl.structureOnly">家具なし（間取りだけ）で読み込む</span></label>
            <label class="toggle-inline"><span class="switch"><input type="checkbox" class="switch-input" id="tplClues" /><span class="switch-track" aria-hidden="true"></span></span><span data-i18n="tpl.clues">隠し手がかり入りで読み込む</span></label>
          </div>
        </div>
        <p class="modal-intro" data-i18n="tpl.intro"></p>
        <div class="tpl-groups" id="tplGroups" role="group"></div>
        <div class="tpl-grid" id="tplGrid"></div>
        <p class="tpl-foot" data-i18n="tpl.replaceNote"></p>
      </section>
    </div>

    <div class="modal-backdrop" id="expModal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="expTitle">
        <button class="drawer-close" type="button" data-close-modal data-i18n-label="close" aria-label="閉じる">×</button>
        <h2 id="expTitle" data-i18n="exp.title">画像を書き出す</h2>
        <div class="export-layout">
          <div class="export-options" id="expOptions"></div>
          <div class="export-side">
            <div class="export-preview" id="expPreview"></div>
          </div>
        </div>
      </section>
    </div>

    <div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="true"></div>

    <footer class="legal-footer">
      <h2 data-i18n="footer.title">利用上の注意</h2>
      <p data-i18n-html="footer.note1"></p>
      <p data-i18n-html="footer.note2"></p>
      <p data-i18n-html="footer.note3"></p>
    </footer>
  </div>

  <script src="./js/model.js?v=20261007-01"></script>
  <script src="./js/assets.js?v=20261007-01"></script>
  <script src="./js/render.js?v=20261007-01"></script>
  <script src="./js/templates.js?v=20261007-01"></script>
  <script src="./js/i18n.js?v=20261007-01"></script>
  <script src="./js/editor.js?v=20261007-01"></script>
</body>
</html>
