<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三大探索技能｜職業の選択肢｜TRPG WEBツール観測所</title>
  <meta name="description" content="目星・聞き耳・図書館をチェックして、固定職業技能に含む職業を170件から検索。推奨技能の条件と職業の選択肢の関係を確認できます。">
  <link rel="icon" href="../../assets/img/kuma_icon.png" type="image/png">
  <link rel="canonical" href="https://kumachansteps.github.io/trpg-web-tools/tools/three-skills-occupation-filter/">
  <link rel="stylesheet" href="style.css">
  <script async src="../../assets/js/analytics.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
<main>
  <nav><a href="../../">← TRPG WEBツール観測所</a><a href="../trpg-three-skills-calculator/">ポイント計算 ↗</a></nav>
  <header>
    <h1>職業の選択肢</h1>
    <p class="lead">三大探索技能を、職業技能でそろえると。</p>
  </header>
  <div class="layout">
    <section class="panel filters" aria-labelledby="filter-title">
      <h2 id="filter-title">職業技能で取りたい技能</h2>
      <fieldset>
        <legend class="sr-only">選んだすべての技能を固定職業技能に含む職業を表示</legend>
        <label class="skill"><input type="checkbox" value="目星">目星</label>
        <label class="skill"><input type="checkbox" value="聞き耳">聞き耳</label>
        <label class="skill"><input type="checkbox" value="図書館">図書館</label>
      </fieldset>
      <div class="actions"><button type="button" id="select-all" aria-label="3つの技能をすべて選ぶ">すべて</button><button type="button" id="clear">クリア</button></div>
      <div class="source-control">
      <label class="source-label" for="source">出典</label>
      <select id="source">
        <option value="all">全出典</option>
        <option value="クトゥルフ2015">2015 · 6版</option>
        <option value="クトゥルフ2026">2026 · 7版</option>
        <option value="クトゥルフ神話TRPGプレイングガイド">ガイド · 7版</option>
      </select>
      </div>
    </section>
    <section class="panel results" aria-labelledby="result-title">
      <h2 id="result-title">該当する職業</h2>
      <div id="summary" role="status" aria-live="polite" aria-atomic="true">
        <p class="count"><strong id="count">—</strong><span id="denominator"> / — 件</span><b id="percent">—</b></p>
        <p id="scope-label" class="small">職業データを読み込んでいます…</p>
        <div class="ratio" aria-hidden="true"><div id="ratio-fill"></div></div>
        <p id="impact"></p>
      </div>
      <p class="context">条件外の職業でも、選択技能や興味Pで取得できます。</p>
      <div class="list-header" aria-hidden="true"><span>職業名</span><span>出典</span></div>
      <div class="job-list" id="job-list" tabindex="0" role="region" aria-label="該当職業一覧"></div>
      <p id="error" role="alert" hidden></p>
      <noscript><p>職業の絞り込みにはJavaScriptを有効にしてください。</p></noscript>
    </section>
  </div>
  <footer>
    <p>v0.1 · <a href="../../terms.html">利用規約</a> · <a href="../../privacy.html">プライバシーポリシー</a></p>
  </footer>
</main>
</body>
</html>
