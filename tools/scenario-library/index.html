<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シナリオライブラリ | TRPG WEBツール観測所</title>
  <meta name="description" content="BOOTH などで配布されている TRPG シナリオを横断検索。システム・人数・時間・秘匿HOで絞り込めます。" />
  <link rel="icon" href="../../assets/img/kuma_icon.png?v=20260910" type="image/png" />
  <script async src="../../assets/js/analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="../../shared/hub/hub.css?v=0.1.0" />
  <link rel="stylesheet" href="css/library.css?v=0.1.1" />
</head>
<body class="hub" data-hub-tool="library">
  <nav id="hubRail"></nav>

  <main class="hub-main">
    <header class="hub-header">
      <div class="hub-header-top">
        <div class="hub-header-left">
          <a class="hub-portal" href="https://kumachansteps.github.io/trpg-web-tools/">← TRPG Webツール観測所</a>
          <div class="hub-title-row">
            <span class="hub-icon" aria-hidden="true">⌕</span>
            <h1>シナリオライブラリ</h1>
          </div>
        </div>
        <div class="hub-actions">
          <a class="hub-btn" href="https://x.com/KumachanSteps" target="_blank" rel="noopener noreferrer" aria-label="X">𝕏</a>
          <button id="usageBtn" class="hub-btn is-accent" type="button" aria-expanded="false" aria-controls="usagePanel">使い方</button>
          <button id="themeToggleBtn" class="hub-btn" type="button">Light/Night</button>
        </div>
      </div>
      <div class="hub-header-meta">
        <p class="hub-version">v0.1.1 2026.10.24</p>
      </div>
    </header>

    <section id="usagePanel" class="hub-panel" hidden>
      <div class="hub-panel-body lib-usage">
        <p>表記ゆれ（全角半角・【配布版】など）はそろえて検索します。</p>
        <p>集めているのは配布ページの公開情報だけです。表紙は配布元から直接表示します。</p>
      </div>
    </section>

    <section class="hub-stats" aria-label="収録状況">
      <article class="hub-stat"><div><p>収録作品</p><strong id="statWorks">—</strong></div></article>
      <article class="hub-stat"><div><p>作者・サークル</p><strong id="statWriters">—</strong></div></article>
      <article class="hub-stat"><div><p>新着</p><strong id="statNew">—</strong></div></article>
      <article class="hub-stat"><div><p>本棚</p><strong id="statShelf">—</strong></div></article>
    </section>

    <section class="hub-panel lib-search" aria-label="検索">
      <div id="sampleBanner" class="hub-banner" hidden>サンプルデータ</div>
      <div class="lib-search-body">
        <div class="lib-row">
          <label class="hub-search lib-q"><span aria-hidden="true">⌕</span><input id="qInput" type="search" placeholder="シナリオ名・作者・サークル" autocomplete="off" /></label>
          <select id="sortSelect" class="hub-select lib-sort" aria-label="並び順">
            <option value="relevance">関連度順</option>
            <option value="new">新着順</option>
            <option value="short">プレイ時間が短い順</option>
            <option value="title">タイトル順</option>
          </select>
        </div>
        <div class="lib-row lib-chips" role="group" aria-label="システム">
          <span id="systemChips" class="lib-chip-list"></span>
        </div>
        <div class="lib-row">
          <select id="plSelect" class="hub-select" aria-label="人数">
            <option value="">人数</option>
            <option value="1">タイマン</option>
            <option value="2">2PL</option>
            <option value="3">3PL</option>
            <option value="4">4PL 以上</option>
          </select>
          <select id="timeSelect" class="hub-select" aria-label="時間">
            <option value="">時間</option>
            <option value="0-180">3h 未満</option>
            <option value="180-360">3〜6h</option>
            <option value="360-600">6〜10h</option>
            <option value="600-99999">10h 以上</option>
          </select>
          <select id="priceSelect" class="hub-select" aria-label="価格">
            <option value="">価格</option>
            <option value="free">無料</option>
            <option value="paid">有料</option>
          </select>
          <label class="hub-check"><input id="hoCheck" type="checkbox" />秘匿HOあり</label>
          <label class="hub-check"><input id="notOwnedCheck" type="checkbox" />本棚にない</label>
          <button id="resetBtn" class="hub-linkbtn" type="button">クリア</button>
        </div>
      </div>
    </section>

    <div class="lib-layout">
      <section class="lib-results" aria-label="検索結果">
        <div class="lib-results-head">
          <span id="countLine" class="lib-count" aria-live="polite">読み込み中…</span>
        </div>
        <div id="resultGrid" class="lib-grid"></div>
        <div id="emptyState" class="hub-empty" hidden>見つかりませんでした</div>
        <div id="errorState" class="hub-empty" hidden></div>
        <button id="moreBtn" class="hub-btn is-large lib-more" type="button" hidden>さらに表示</button>
      </section>

      <aside id="detail" class="hub-panel lib-detail" aria-label="選択中の作品" hidden>
        <div id="detailCover" class="hub-cover lib-detail-cover"></div>
        <div class="lib-detail-head">
          <div id="detailPills" class="lib-pills"></div>
          <h2 id="detailTitle"></h2>
          <p id="detailBy" class="lib-by"></p>
        </div>
        <dl class="lib-dl">
          <dt>価格</dt><dd id="detailPrice"></dd>
          <dt>配布元</dt><dd id="detailSource"></dd>
          <dt>別名</dt><dd id="detailAliases"></dd>
          <dt>タグ</dt><dd id="detailTags"></dd>
        </dl>
        <div class="lib-mine">
          <div class="lib-mine-grid">
            <a href="../scenario-bookshelf/index.html"><strong id="mineShelf">—</strong><span>本棚</span></a>
            <a href="../session-log-tool/index.html"><strong id="mineLog">—</strong><span>卓ログ</span></a>
          </div>
        </div>
        <div class="lib-actions">
          <a id="sourceLink" class="hub-btn is-ink is-large" href="#" target="_blank" rel="noopener noreferrer">配布ページ ↗</a>
          <button id="shelfBtn" class="hub-btn is-note is-large" type="button">本棚に追加</button>
          <a id="suggestLink" class="hub-linkbtn" href="../../report/" target="_blank" rel="noopener">修正を提案</a>
        </div>
      </aside>
    </div>

    <p id="attribution" class="hub-footnote">CC BY 4.0</p>
  </main>

  <script src="../../shared/hub/shell.js?v=0.1.0"></script>
  <script src="../../shared/hub/store.js?v=0.1.0"></script>
  <script src="../../shared/hub/scenario-core.js?v=0.1.0"></script>
  <script src="../../shared/hub/catalog.js?v=0.1.0"></script>
  <script src="../../shared/hub/bookshelf-data.js?v=0.1.0"></script>
  <script src="js/library.js?v=0.1.1"></script>
</body>
</html>
